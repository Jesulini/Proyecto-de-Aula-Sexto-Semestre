<ion-content class="custom-cartelera">
  <app-header [pageTitle]="'Cartelera Películas'" (toggleMenuEvent)="menu.toggleMenu()"></app-header>
  <app-sidebar-menu #menu [esAdmin]="esAdmin"></app-sidebar-menu>

  <div class="cartelera-container" [class.menu-open]="menu.menuAbierto">
    <aside class="categorias">
      <h3>Categorías</h3>
      <ul>
        <li *ngFor="let categoria of categorias"
            (click)="filtrarPorCategoria(categoria)"
            [class.active]="categoriaSeleccionada === categoria">
          {{ categoria }}
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="search-bar">
        <input type="text"
               placeholder="Buscar película..."
               [(ngModel)]="terminoBusqueda"
               (input)="buscarPeliculas()" />
      </div>

      <div class="movies-grid">
        <div class="movie-card"
             *ngFor="let movie of peliculasFiltradas"
             (click)="verDetalle(movie.id)">
          <img [src]="movie.imageUrl" alt="{{ movie.title }}" />
          <h4>{{ movie.title }}</h4>
          <p>{{ movie.category }}</p>

          <div *ngIf="esAdmin" class="admin-controls">
            <button (click)="abrirEditar(movie); $event.stopPropagation()"
                    class="edit-btn"
                    title="Editar">Editar</button>
            <button (click)="eliminar(movie); $event.stopPropagation()"
                    class="delete-btn"
                    title="Eliminar">Eliminar</button>
          </div>
        </div>
      </div>

      <section *ngIf="esAdmin" class="admin-panel">
        <app-admin-panel #adminPanel
                         (editingChange)="onEditingChange($event)">
        </app-admin-panel>
      </section>
    </main>
  </div>
</ion-content>
