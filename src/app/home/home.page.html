<ion-content class="custom-home">
  <app-message-box></app-message-box>
  <app-header [pageTitle]="'Inicio'" (toggleMenuEvent)="menu.toggleMenu()"></app-header>
  <app-sidebar-menu #menu [esAdmin]="isAdmin"></app-sidebar-menu>

  <div class="home-container" [class.menu-open]="menu.menuAbierto" *ngIf="!isEditingGlobal">
    <app-carousel 
      [items]="featuredList" 
      (play)="abrirModalReproducir($event)" 
      (info)="goToMovie($event)">
    </app-carousel>

    <app-movie-carousel 
      [categoriasConfig]="categoriasConfig" 
      [isAdmin]="isAdmin"
      (select)="goToMovie($event)"
      (edit)="onEditMovie($event)"
      (delete)="onDeleteMovie($event)">
    </app-movie-carousel>

    <app-admin-panel 
      #adminPanel
      *ngIf="isAdmin" 
      (editingChange)="onEditingChange($event)">
    </app-admin-panel>
  </div>

  <ion-modal [isOpen]="modalReproducirAbierto" (didDismiss)="cerrarModalReproducir()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title>{{ peliculaReproducir?.title }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModalReproducir()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <div class="video-container">
          <ng-container *ngIf="esYoutubeUrl(peliculaReproducir?.trailerUrl || peliculaReproducir?.movieUrl); else videoLocal">
            <iframe width="100%" height="315"
              [src]="getSafeUrl(peliculaReproducir?.trailerUrl || peliculaReproducir?.movieUrl)" frameborder="0"
              allowfullscreen></iframe>
          </ng-container>
          <ng-template #videoLocal>
            <video *ngIf="peliculaReproducir?.movieUrl" [src]="peliculaReproducir?.movieUrl" controls autoplay width="100%"></video>
          </ng-template>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
