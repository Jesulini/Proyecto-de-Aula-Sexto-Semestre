<ng-container *ngFor="let cat of categoriasConfig; let i = index">
  <section class="movie-carousel">
    <h2>{{ cat.titulo }}</h2>
    <div class="carrusel">
      <button class="btn prev" type="button" (click)="prevCarrusel(cat.titulo)">&#10094;</button>

      <div class="contenedor-carrusel" #carruselContainer>
        <div class="track">
          <div class="movie" *ngFor="let movie of cat.lista">
            <img [src]="movie.imageUrl" alt="{{ movie.title }}" (click)="onSelect(movie)" />
            <h3>{{ movie.title }}</h3>
            <p *ngIf="movie.category" class="category">{{ movie.category }}</p>
            <div *ngIf="isAdmin" class="admin-actions">
              <button class="edit-btn" type="button" (click)="onEdit(movie)">Editar</button>
              <button class="delete-btn" type="button" (click)="onDelete(movie)">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <button class="btn next" type="button" (click)="nextCarrusel(cat.titulo)">&#10095;</button>
    </div>
  </section>
</ng-container>
